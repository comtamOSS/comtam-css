<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="text-scale" content="scale" />
  %sveltekit.head%
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--ct-grey-50);
      font-family: var(--ct-body-font);
      font-weight: 400;
      font-style: normal;
      color: var(--ct-body-color);
    }

    html {
      width: 100vw;
      height: 100vh;
      font-size: 16px;
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      background: none;
      border: none;
    }

    p {
      margin: 0;
    }
  </style>
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
