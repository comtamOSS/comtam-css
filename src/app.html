<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
    <style>
       body {
         margin: 0;
         width: 100%;
         height: 100%;
         background-color: var(--ct-grey-50);
         font-family: var(--ct-font-body);
         font-weight: 400;
       }

       html {
         width: 100%;
         height: 100%;
         font-size: 16px;
       }

       a {
         text-decoration: none;
         color: inherit;
       }

       button {
         background: none;
         border: none;
       }

    </style>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
